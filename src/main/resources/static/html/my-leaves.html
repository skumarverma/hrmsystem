<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>My Leaves - HRM System</title>
    <link rel="stylesheet" href="../css/hrm-design-system.css">
    <link rel="stylesheet" href="../css/employee-theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar-container"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Welcome Banner -->
            <div class="welcome-banner"
                style="background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%) !important; color: white; padding: 2rem; border-radius: 1rem; margin-bottom: 2rem; box-shadow: var(--shadow-lg); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; transition: transform 0.3s ease; flex-wrap: wrap;">
                <!-- Ambient glows for aesthetic excellence -->
                <div
                    style="position: absolute; right: -50px; bottom: -50px; width: 220px; height: 220px; background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, transparent 70%); border-radius: 50%;">
                </div>
                <div
                    style="position: absolute; left: -30px; top: -50px; width: 180px; height: 180px; background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, transparent 70%); border-radius: 50%;">
                </div>

                <div style="z-index: 1;">
                    <h1
                        style="margin: 0; font-size: 2.25rem; font-weight: 800; color: white; letter-spacing: -0.03em; text-shadow: 0 2px 4px rgba(0,0,0,0.15); line-height: 1;">
                        My Leaves</h1>
                    <p
                        style="margin: 0.5rem 0 0 0; color: rgba(255, 255, 255, 0.75); font-size: 0.95rem; font-weight: 500;">
                        Track your leave balances and application status</p>
                </div>

                <!-- Integrated Action Area on the Banner -->
                <div class="flex gap-2 items-center" style="z-index: 1;">
                    <a href="leave-request.html" class="btn-primary"
                        style="background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%); color: var(--primary-dark) !important; border: none; box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3); font-weight: 700; display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1.2rem; border-radius: 0.375rem; text-decoration: none;">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                            <path d="M12 4v16m8-8H4" />
                        </svg>
                        Apply Leave
                    </a>
                </div>
            </div>

            <div class="page-content">


                <div class="card p-0 overflow-hidden">
                    <div class="card-header border-b p-4">
                        <h3 class="card-title">Leave Applications</h3>
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Type</th>
                                    <th>From</th>
                                    <th>To</th>
                                    <th>Days</th>
                                    <th class="text-center">Paid</th>
                                    <th class="text-center">Unpaid</th>
                                    <th>Reason</th>
                                    <th>Approver</th>
                                    <th>Status</th>
                                    <th class="text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="leaves-table">
                                <tr>
                                    <td colspan="10" class="text-center p-8 text-muted">Loading applications...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Cancellation Reason Modal -->
    <div id="cancellation-modal" class="modal">
        <div class="modal-backdrop" onclick="closeCancellationModal()"></div>
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header border-b">
                <h3 class="modal-title text-danger">Leave Cancellation</h3>
                <button onclick="closeCancellationModal()" class="btn-icon">&times;</button>
            </div>
            <div class="modal-body space-y-6">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-danger-50 flex items-center justify-center text-danger-600">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
                        </svg>
                    </div>
                    <div>
                        <h4 class="font-bold text-gray-800">Rejection Reason</h4>
                        <p class="text-xs text-muted">Provided by Admin/Manager</p>
                    </div>
                </div>

                <div class="card bg-gray-50 border-gray-200 p-4">
                    <p id="cancellation-reason-text" class="text-sm text-gray-700 leading-relaxed italic">No reason
                        provided</p>
                </div>

                <div class="flex justify-end pt-4 border-t">
                    <button onclick="closeCancellationModal()" class="btn-primary px-8">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/sidebar.js"></script>
    <script>
        if (!auth.requireAuth()) throw new Error('Auth required');

        // Render sidebar explicitly
        renderSidebar();

        const user = auth.getCurrentUser();

        // Helper: count working days between two dates (excluding Sundays)
        function countDaysExcludingSundays(startDateStr, endDateStr) {
            if (!startDateStr || !endDateStr) return 0;
            const startParts = startDateStr.split('-');
            const endParts = endDateStr.split('-');
            let current = new Date(startParts[0], startParts[1] - 1, startParts[2]);
            const endDate = new Date(endParts[0], endParts[1] - 1, endParts[2]);
            let count = 0;
            while (current <= endDate) {
                if (current.getDay() !== 0) { // 0 is Sunday
                    count++;
                }
                current.setDate(current.getDate() + 1);
            }
            return count;
        }

        async function loadMyLeaves() {
            try {
                // Fetch centralized dashboard data (contains both attendance and leave balance)
                const timestamp = new Date().getTime();
                const res = await auth.apiCall(`/api/dashboard/my?_t=${timestamp}`);

                if (!res || !res.ok) {
                    throw new Error('Failed to load leave statistics');
                }

                const dashboardData = await res.json();
                const leaveBalanceData = dashboardData.leaveBalance;
                const attendance = dashboardData.attendance;

                if (!leaveBalanceData) {
                    throw new Error('Leave balance data missing');
                }

                const isInProbation = leaveBalanceData.inProbation;


                const resLeaves = await auth.apiCall('/api/leaves/my');
                const dataLeaves = resLeaves && resLeaves.ok ? await resLeaves.json() : [];

                const tbody = document.getElementById('leaves-table');
                if (!dataLeaves || dataLeaves.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="10" class="text-center p-8 text-muted">No leave applications found</td></tr>';
                    return;
                }

                tbody.innerHTML = dataLeaves.map(l => {
                    const days = l.totalDays || countDaysExcludingSundays(l.startDate, l.endDate);
                    const isHalfDay = l.isHalfDay ? '<span class="text-primary">(Half)</span>' : '';

                    const paidDisplay = isInProbation
                        ? '<span class="text-muted text-xs">N/A</span>'
                        : (l.paidDays || 0);
                    const unpaidDisplay = isInProbation && (l.unpaidDays || 0) > 0
                        ? `<span class="text-danger font-bold">${l.unpaidDays || 0}</span>`
                        : (l.unpaidDays || 0);

                    const actionsCell = (l.status === 'CANCELLED' || l.status === 'REJECTED')
                        ? `<td class="text-center">
                            <button onclick="viewCancellationReason(${l.id})" class="btn-secondary" style="padding: 4px 12px; font-size: 0.75rem;">View Reason</button>
                           </td>`
                        : '<td class="text-center text-muted">-</td>';

                    return `
                        <tr>
                            <td><strong>${l.leaveType || 'CASUAL'}</strong></td>
                            <td>${auth.formatDate(l.startDate)}</td>
                            <td>${auth.formatDate(l.endDate)}</td>
                            <td>${days} ${isHalfDay}</td>
                            <td class="text-center">${paidDisplay}</td>
                            <td class="text-center">${unpaidDisplay}</td>
                            <td><span class="text-sm">${l.reason || '-'}</span></td>
                            <td><span class="text-sm font-semibold text-gray-700">${l.approverName || '-'}</span></td>
                            <td><span class="status-badge ${(l.status || 'PENDING').toLowerCase()}">${l.status || 'PENDING'}</span></td>
                            ${actionsCell}
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                console.error(e);
                auth.showNotification('Failed to load leaves', 'error');
            }
        }

        async function viewCancellationReason(leaveId) {
            try {
                let leave = typeof dataLeaves !== 'undefined' ? dataLeaves.find(l => l.id === leaveId) : null;
                if (!leave) {
                    const res = await auth.apiCall(`/api/leaves/${leaveId}`);
                    if (res && res.ok) leave = await res.json();
                }

                if (leave) {
                    const isRejected = leave.status === 'REJECTED';
                    
                    const modalTitle = document.querySelector('#cancellation-modal .modal-title');
                    if (modalTitle) modalTitle.textContent = isRejected ? 'Leave Rejection' : 'Leave Cancellation';
                    
                    const reasonTitle = document.querySelector('#cancellation-modal h4');
                    if (reasonTitle) reasonTitle.textContent = isRejected ? 'Rejection Reason' : 'Cancellation Reason';
                    
                    const reason = leave.rejectionReason || leave.cancellationReason || 'No reason provided by admin';
                    document.getElementById('cancellation-reason-text').textContent = reason;
                    document.getElementById('cancellation-modal').classList.add('active');
                    document.body.style.overflow = 'hidden';
                    document.documentElement.style.overflow = 'hidden';
                }
            } catch (e) {
                console.error(e);
            }
        }

        function closeCancellationModal() {
            document.getElementById('cancellation-modal').classList.remove('active');
            document.body.style.overflow = '';
            document.documentElement.style.overflow = '';
        }

        // Close modal when clicking outside
        document.getElementById('cancellation-modal').addEventListener('click', function (e) {
            if (e.target === this) {
                closeCancellationModal();
            }
        });

        // Load data when page loads
        loadMyLeaves();
    </script>
</body>

</html>
