<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HRM System</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .test-account-row {
            cursor: pointer;
            padding: 0.5rem;
            background: white;
            border-radius: 4px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            transition: background-color 0.2s;
        }
        .test-account-row:hover {
            background-color: #e5e7eb;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-header">
                <div class="logo-wrapper" style="text-align: center; margin-bottom: 1.5rem;">
                    <img src="../images/logo.png" alt="HRM System Logo" style="max-height: 80px; width: auto; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to your HRM System account</p>
            </div>

            <div id="error-message" class="error-message" style="display: none;"></div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Mobile Number</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                        <input type="tel" name="mobileNumber" id="mobileNumber" class="form-input" placeholder="Enter your 10-digit mobile number" required>
                    </div>
                </div>

                <div class="form-group" id="otp-group" style="display: none; margin-top: 1rem;">
                    <label class="form-label">Enter OTP Code</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="text" name="otp" id="otp" class="form-input" placeholder="Enter 6-digit OTP" maxlength="6">
                    </div>
                    <div style="font-size: 0.8rem; color: #4f46e5; margin-top: 0.5rem; display: flex; justify-content: space-between;">
                        <span id="otp-timer">OTP expires in 2:00</span>
                        <div>
                            <span id="back-to-mobile" style="cursor: pointer; text-decoration: underline; margin-right: 1rem; color: #6b7280;">Change Number</span>
                            <span id="resend-link" style="cursor: pointer; text-decoration: underline; display: none;">Resend OTP</span>
                        </div>
                    </div>
                </div>

                <div class="form-options" style="margin-top: 1rem;">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                </div>

                <button type="button" id="send-otp-btn" class="btn-auth" style="margin-top: 1rem;">
                    <span id="send-btn-text">Send OTP</span>
                    <span id="send-btn-loading" style="display: none;">
                        <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
                            <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"></path>
                        </svg>
                        Sending OTP...
                    </span>
                </button>

                <button type="submit" id="submit-btn" class="btn-auth" style="display: none; margin-top: 1rem;">
                    <span id="btn-text">Verify & Sign In</span>
                    <span id="btn-loading" style="display: none;">
                        <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
                            <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"></path>
                        </svg>
                        Signing in...
                    </span>
                </button>
            </form>

            <div class="auth-footer" style="display: none;">
                <p>Don't have an account? <a href="register.html">Sign up</a></p>
            </div>



            <!-- Test Accounts Section -->
            <div style="display: none; margin-top: 2rem; padding: 1rem; background: #f3f4f6; border-radius: 8px; border: 1px dashed #9ca3af;">
                <p style="font-size: 0.75rem; color: #6b7280; margin-bottom: 0.75rem; text-align: center; font-weight: 600;">TEST ACCOUNTS (Click to auto-fill)</p>
                
                <div style="display: grid; gap: 0.5rem;">
                    <div onclick="fillCredentials('admin', 'Sachin@123')" class="test-account-row">
                        <span><strong>Admin</strong> (Full Access)</span>
                        <span style="color: #6b7280;">admin / Sachin@123</span>
                    </div>
                    <div onclick="fillCredentials('hradmin', 'Sachin@123')" class="test-account-row">
                        <span><strong>HR</strong> (Management)</span>
                        <span style="color: #6b7280;">hradmin / Sachin@123</span>
                    </div>
                    <div onclick="fillCredentials('accountant', 'Sachin@123')" class="test-account-row">
                        <span><strong>Accountant</strong> (Payroll)</span>
                        <span style="color: #6b7280;">accountant / Sachin@123</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
