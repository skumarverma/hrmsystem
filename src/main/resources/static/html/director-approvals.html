<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Director Approvals - HRM System</title>
    <link rel="stylesheet" href="../css/hrm-design-system.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar-container"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header flex justify-between items-center mb-6">
                <div class="page-title">
                    <h1>Payroll Approval Status</h1>
                    <p>Monitor the status of current payroll batches</p>
                </div>
                <div class="flex gap-2 items-center">
                    <span class="badge-director" style="background: #e0e7ff; color: #3730a3; padding: 0.5rem 1rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem;">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Director View
                    </span>
                    <button class="btn-danger flex items-center gap-2" onclick="auth.logout()">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                        Logout
                    </button>
                </div>
            </header>

            <div class="page-content">
                <div class="card p-0 overflow-hidden shadow-sm border border-gray-100">
                    <div class="card-header border-b border-gray-100 flex justify-between items-center" style="padding: 1.25rem 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; background: #f9fafb;">
                        <h3 class="card-title font-semibold text-gray-700" style="margin: 0; font-size: 1.1rem;">Approval Records</h3>
                        <div class="flex gap-2 items-center" style="display: flex; gap: 0.75rem; align-items: center;">
                            <select id="month-filter" class="form-control" style="padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid #d1d5db; font-size: 0.875rem; background: white;" onchange="renderFilteredApprovals()">
                                <option value="ALL">All Months</option>
                                <option value="1">January</option>
                                <option value="2">February</option>
                                <option value="3">March</option>
                                <option value="4">April</option>
                                <option value="5">May</option>
                                <option value="6">June</option>
                                <option value="7">July</option>
                                <option value="8">August</option>
                                <option value="9">September</option>
                                <option value="10">October</option>
                                <option value="11">November</option>
                                <option value="12">December</option>
                            </select>
                            <select id="year-filter" class="form-control" style="padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid #d1d5db; font-size: 0.875rem; background: white;" onchange="renderFilteredApprovals()">
                                <option value="ALL">All Years</option>
                                <option value="2026">2026</option>
                                <option value="2025">2025</option>
                                <option value="2024">2024</option>
                            </select>
                        </div>
                    </div>
                    <div class="table-container dashboard-table-scroll">
                        <table class="data-table w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b border-gray-200">
                                    <th class="p-4 font-semibold text-gray-700">Employee</th>
                                    <th class="p-4 font-semibold text-gray-700">Month/Year</th>
                                    <th class="p-4 font-semibold text-gray-700">Net Salary</th>
                                    <th class="p-4 font-semibold text-gray-700">Accountant Status</th>
                                    <th class="p-4 font-semibold text-gray-700">Admin Status</th>
                                </tr>
                            </thead>
                            <tbody id="approvals-table" class="divide-y divide-gray-100">
                                <tr><td colspan="5" class="text-center p-8 text-gray-500">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/sidebar.js"></script>
    <script>
        if (!auth.requireAuth()) throw new Error('Auth required');
        
        let allApprovals = [];

        async function loadApprovals() {
            try {
                const res = await auth.apiCall('/api/payroll/list');
                allApprovals = res && res.ok ? await res.json() : [];
                
                // Set default filters to current month/year
                const now = new Date();
                document.getElementById('month-filter').value = now.getMonth() + 1;
                document.getElementById('year-filter').value = now.getFullYear();
                
                renderFilteredApprovals();
            } catch (e) { console.error(e); }
        }

        function renderFilteredApprovals() {
            const tbody = document.getElementById('approvals-table');
            const monthVal = document.getElementById('month-filter').value;
            const yearVal = document.getElementById('year-filter').value;

            let filtered = allApprovals;

            if (monthVal !== 'ALL') {
                filtered = filtered.filter(p => p.month === parseInt(monthVal));
            }
            if (yearVal !== 'ALL') {
                filtered = filtered.filter(p => p.year === parseInt(yearVal));
            }

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 2rem;">No payroll records found for selected period</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map(a => `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="p-4 font-medium text-gray-800">${a.employeeName || 'Unknown'}</td>
                    <td class="p-4 text-gray-600">${a.month}/${a.year}</td>
                    <td class="p-4 font-bold text-gray-800">${auth.formatCurrency(a.netSalary || 0)}</td>
                    <td class="p-4">
                        ${a.accountantApproved 
                            ? '<span class="status-badge active bg-green-100 text-green-700 px-2 py-1 rounded-full text-xs font-medium">✅ Done</span>' 
                            : '<span class="status-badge pending bg-yellow-100 text-yellow-700 px-2 py-1 rounded-full text-xs font-medium">⏳ Pending</span>'}
                    </td>
                    <td class="p-4">
                        ${a.directorApproved 
                            ? '<span class="status-badge active bg-green-100 text-green-700 px-2 py-1 rounded-full text-xs font-medium">✅ Done</span>' 
                            : '<span class="status-badge pending bg-yellow-100 text-yellow-700 px-2 py-1 rounded-full text-xs font-medium">⏳ Pending</span>'}
                    </td>
                </tr>
            `).join('');
        }
        
        function logout() { auth.logout(); }
        loadApprovals();
    </script>
    <style>.badge-director { background: #dbeafe; color: #1e40af; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }</style>
</body>
</html>
