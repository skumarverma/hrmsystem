# JWT Configuration
jwt:
  secret: ${JWT_SECRET:ThisIsAVerySecureSecretKeyForJWTTokenGenerationThatMustBeAtLeast32CharactersLong!123456}
  expiration: ${JWT_EXPIRATION:86400000}

# Payslip Configuration
payslip:
  pdf:
    output:
      path: payslips/

# Company Details
company:
  name: HRM System
  address: Your Company Address

# Logging Configuration
logging:
  level:
    root: INFO
    com.hrm.hrmsystem: INFO
    org.springframework.web: WARN
    org.hibernate: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

  file:
    name: logs/hrmsystem.log
    max-size: 10MB
    max-history: 30

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: when_authorized

  info:
    env:
      enabled: true

info:
  app:
    name: HRM System
    description: Human Resource Management System
    version: 1.0.0

