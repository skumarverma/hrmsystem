server:
  port: ${PORT:8082}

  error:
    include-message: always
    include-binding-errors: always

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:enego.ct2au2680qip.ap-south-1.rds.amazonaws.com}:3306/hrmsystem?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:admin}
    password: ${MYSQL_PASSWORD:Rishu952818}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
      minimum-idle: 5
      maximum-pool-size: 30
      idle-timeout: 300000
      max-lifetime: 450000
      connection-timeout: 20000
      pool-name: HikariCP

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false

    open-in-view: false

  flyway:
    enabled: false

  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:2525}
    username: ${SMTP_USERNAME:abaed9001@smtp-brevo.com}
    password: ${SMTP_PASSWORD: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}
    from: ${SMTP_FROM:skvenego@gmail.com}
    default-encoding: UTF-8

    properties:
      mail:
        debug: true

        smtp:
          auth: true

          starttls:
            enable: true
            required: true

          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  web:
    resources:
      cache:
        period: 0

      static-locations: file:src/main/resources/static/

  mvc:
    static-path-pattern: /**

